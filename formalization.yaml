version: "v0.4"
project:
  name: "Six homogeneous components in the first Weyl algebra"
  description: >-
    Over any characteristic-zero field, two elements P and Q of the first
    Weyl algebra satisfying QP-PQ=1 generate the algebra when P has at most
    six nonzero homogeneous components for deg X=1 and deg Y=-1.
    The degree, order and mass of Q are unrestricted. The proof combines
    sparse-polynomial rigidity with internally proved Newton and Weyl-algebra
    structural results.
  authors:
    - name: "Idris Ali Shaik"
  responsible_maintainers:
    - name: "Idris Ali Shaik"
  license: "MIT"
